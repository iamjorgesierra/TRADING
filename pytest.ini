# Quant Trading Platform — Configuración de pytest
# Ejecutar desde la raíz del proyecto: pytest backend/tests/

[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Output verboso por defecto
addopts = -v --tb=short

# Marcadores personalizados
markers =
    unit: Unit tests (sin I/O externo)
    integration: Tests de integración (requieren Redis/PostgreSQL)
    slow: Tests lentos (backtesting, carga de datos)
