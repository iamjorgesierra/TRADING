version: '3.9'

services:

  # ──────────────────────────────────────────────
  # INFRAESTRUCTURA BASE
  # ──────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradingdb}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-tradingdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - trading_net

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_net

  # ──────────────────────────────────────────────
  # MICROSERVICIOS
  # ──────────────────────────────────────────────
  market-data-service:
    build:
      context: ./backend
      dockerfile: services/market-data-service/Dockerfile
    container_name: trading_market_data
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      OANDA_API_KEY: ${OANDA_API_KEY:-}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID:-}
      OANDA_ENV: ${OANDA_ENV:-practice}
    ports:
      - "${MARKET_DATA_PORT:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading_net
    volumes:
      - ./backend/shared:/app/shared:ro

  historical-data-service:
    build:
      context: ./backend
      dockerfile: services/historical-data-service/Dockerfile
    container_name: trading_historical_data
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading_secret}@postgres:5432/${POSTGRES_DB:-tradingdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    ports:
      - "${HISTORICAL_DATA_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading_net
    volumes:
      - ./backend/shared:/app/shared:ro

  session-engine:
    build:
      context: ./backend
      dockerfile: services/session-engine/Dockerfile
    container_name: trading_session_engine
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    ports:
      - "${SESSION_ENGINE_PORT:-8003}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading_net
    volumes:
      - ./backend/shared:/app/shared:ro

  indicator-engine:
    build:
      context: ./backend
      dockerfile: services/indicator-engine/Dockerfile
    container_name: trading_indicator_engine
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    ports:
      - "${INDICATOR_ENGINE_PORT:-8004}:8004"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading_net
    volumes:
      - ./backend/shared:/app/shared:ro

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  trading_net:
    driver: bridge
    name: trading_network
